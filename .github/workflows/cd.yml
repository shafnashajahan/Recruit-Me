name: CD

# Runs automatically after CI succeeds on main, or manually from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push the image to GitHub Container Registry (free)
  id-token: write   # Azure login with OIDC (no stored passwords)

jobs:
  build-and-push:
    name: Build & push image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Compute lowercase image name
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Choose the target by setting the repository VARIABLE DEPLOY_TARGET to: azure | aws | none
  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    if: vars.DEPLOY_TARGET == 'azure'
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Point the Container App at the new image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade --only-show-errors
            az containerapp update \
              --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "${{ needs.build-and-push.outputs.image }}"

  deploy-aws:
    name: Deploy to AWS EC2
    needs: build-and-push
    if: vars.DEPLOY_TARGET == 'aws'
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Pull and restart the container over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker pull ${{ needs.build-and-push.outputs.image }}
            docker rm -f recruitme || true
            docker run -d --name recruitme --restart unless-stopped \
              -p 80:8501 \
              -e OLLAMA_BASE_URL="${{ vars.OLLAMA_BASE_URL }}" \
              ${{ needs.build-and-push.outputs.image }}
            docker image prune -f
